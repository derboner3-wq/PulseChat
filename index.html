<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>PulseChat — Групповой чат</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg-primary: #0e0e12;
            --bg-secondary: #1a1a22;
            --bg-card: #22222b;
            --bg-elevated: #2c2c38;
            --bg-input: #2a2a34;
            --bg-hover: #34344a;
            --text-primary: #f0f0f4;
            --text-secondary: #b0b0c0;
            --text-muted: #6a6a7a;
            --accent: #6c8cff;
            --border: #2f2f3e;
            --shadow: 0 12px 40px rgba(0,0,0,0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-elevated: #e4e6eb;
            --bg-input: #e4e6eb;
            --bg-hover: #d1d5db;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --text-muted: #8a8a9e;
            --border: #d1d5db;
            --shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        button, input, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
        button { cursor: pointer; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }

        .page { display: none; width: 100%; height: 100vh; animation: fadeIn 0.3s ease; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity:0; transform:scale(0.98); } to { opacity:1; transform:scale(1); } }

        /* ===== AUTH ===== */
        .auth-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #141a26, var(--bg-primary) 70%);
            padding: 2rem;
            position: relative;
        }
        .auth-box {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 2.5rem 2rem 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .auth-box .auth-logo { font-size:2.2rem; font-weight:700; background:linear-gradient(135deg,#6c8cff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; margin-bottom:0.2rem; }
        .auth-box .auth-title { text-align:center; font-size:1.3rem; font-weight:600; color:var(--text-primary); margin-bottom:0.2rem; }
        .auth-box .auth-sub { text-align:center; color:var(--text-muted); font-size:0.85rem; margin-bottom:1.5rem; }
        .auth-box .auth-sub a { color:#6c8cff; text-decoration:none; font-weight:500; }
        .auth-box .auth-sub a:hover { text-decoration:underline; }
        .auth-box .field { margin-bottom:1rem; }
        .auth-box .field label { display:block; font-size:0.75rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.2rem; text-transform:uppercase; letter-spacing:0.5px; }
        .auth-box .field input { width:100%; padding:0.7rem 0.9rem; border-radius:10px; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); font-size:0.95rem; transition:0.2s; }
        .auth-box .field input:focus { border-color:#6c8cff; background:var(--bg-elevated); box-shadow:0 0 0 3px rgba(108,140,255,0.15); }
        .auth-box .field .optional { font-weight:400; text-transform:none; color:var(--text-muted); font-size:0.65rem; }
        .auth-box .btn-auth { width:100%; padding:0.8rem; border-radius:12px; background:linear-gradient(135deg,#6c8cff,#8b5cf6); color:#fff; font-size:0.95rem; font-weight:600; margin-top:0.5rem; transition:0.2s; box-shadow:0 6px 20px rgba(108,140,255,0.3); }
        .auth-box .btn-auth:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(108,140,255,0.45); }
        .auth-box .auth-error { color:#f87171; font-size:0.85rem; text-align:center; margin-top:0.6rem; min-height:1.2rem; }
        .auth-divider { display:flex; align-items:center; gap:1rem; margin:0.8rem 0; color:var(--text-muted); }
        .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }

        .theme-toggle-auth {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        .theme-toggle-auth:hover { color: var(--text-primary); }
        .theme-toggle-auth input[type="checkbox"] {
            width:36px; height:20px; border-radius:10px; background:var(--bg-input); border:1px solid var(--border);
            appearance:none; cursor:pointer; transition:0.2s; position:relative;
        }
        .theme-toggle-auth input[type="checkbox"]:checked { background:#6c8cff; }
        .theme-toggle-auth input[type="checkbox"]::before {
            content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:1px; left:1px; transition:0.2s;
        }
        .theme-toggle-auth input[type="checkbox"]:checked::before { left:17px; }

        /* ===== MESSENGER ===== */
        #messenger-page { flex-direction:row; background:var(--bg-primary); }
        .messenger-sidebar {
            width:280px; min-width:280px; background:var(--bg-secondary); border-right:1px solid var(--border);
            display:flex; flex-direction:column; height:100vh; overflow:hidden;
        }
        .sidebar-header {
            padding:1rem 1.2rem 0.6rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);
        }
        .sidebar-header .brand { font-size:1.2rem; font-weight:700; background:linear-gradient(135deg,#6c8cff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .sidebar-header .user-avatar {
            width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#6c8cff,#8b5cf6);
            display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.9rem; color:#fff; cursor:pointer; position:relative;
        }
        .sidebar-header .user-avatar:hover { transform:scale(1.05); box-shadow:0 0 0 2px #6c8cff; }
        .sidebar-header .user-avatar .status-dot { position:absolute; bottom:0; right:0; width:10px; height:10px; border-radius:50%; background:#34d399; border:2px solid var(--bg-secondary); }

        .sidebar-search { padding:0.6rem 1rem; }
        .sidebar-search .search-wrap { position:relative; display:flex; align-items:center; }
        .sidebar-search .search-wrap i { position:absolute; left:0.8rem; color:var(--text-muted); font-size:0.8rem; pointer-events:none; }
        .sidebar-search .search-wrap input { width:100%; padding:0.5rem 1rem 0.5rem 2.2rem; border-radius:8px; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); font-size:0.85rem; }
        .sidebar-search .search-wrap input:focus { border-color:#6c8cff; }

        .sidebar-contacts { flex:1; overflow-y:auto; padding:0.4rem 0.6rem 0.8rem; }
        .sidebar-contacts .section-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-muted); padding:0.6rem 0.4rem 0.2rem; font-weight:600; }
        .contact-item { display:flex; align-items:center; padding:0.5rem 0.6rem; border-radius:8px; transition:0.15s; cursor:pointer; gap:0.6rem; }
        .contact-item:hover { background:var(--bg-hover); }
        .contact-item.active { background:rgba(108,140,255,0.15); }
        .contact-item .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.85rem; color:#fff; flex-shrink:0; overflow:hidden; position:relative; }
        .contact-item .avatar img { width:100%; height:100%; object-fit:cover; }
        .contact-item .avatar .status-dot-sm { position:absolute; bottom:0; right:0; width:8px; height:8px; border-radius:50%; border:2px solid var(--bg-secondary); }
        .contact-item .info { flex:1; min-width:0; }
        .contact-item .info .name { font-weight:500; font-size:0.9rem; color:var(--text-primary); }
        .contact-item .info .last-msg { font-size:0.75rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .contact-item .time { font-size:0.65rem; color:var(--text-muted); flex-shrink:0; }
        .contact-item .unread { background:#6c8cff; color:#fff; font-size:0.65rem; font-weight:700; padding:0 0.4rem; border-radius:10px; min-width:18px; text-align:center; flex-shrink:0; }
        .empty-contacts { text-align:center; color:var(--text-muted); padding:2rem 0.5rem; font-size:0.85rem; }
        .empty-contacts i { font-size:2rem; margin-bottom:0.5rem; display:block; color:var(--text-muted); }

        .search-results { padding:0.4rem 0.6rem; border-top:1px solid var(--border); max-height:200px; overflow-y:auto; display:none; }
        .search-result-item { display:flex; align-items:center; padding:0.4rem 0.5rem; border-radius:6px; gap:0.5rem; transition:0.15s; }
        .search-result-item:hover { background:var(--bg-hover); }
        .search-result-item .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.75rem; color:#fff; flex-shrink:0; overflow:hidden; }
        .search-result-item .avatar img { width:100%; height:100%; object-fit:cover; }
        .search-result-item .info { flex:1; min-width:0; }
        .search-result-item .info .name { font-weight:500; font-size:0.85rem; color:var(--text-primary); }
        .search-result-item .info .username { font-size:0.7rem; color:var(--text-muted); }
        .search-result-item .action-btn { padding:0.15rem 0.7rem; border-radius:10px; background:#6c8cff; color:#fff; font-size:0.7rem; font-weight:600; transition:0.2s; border:none; cursor:pointer; }
        .search-result-item .action-btn:hover { background:#5a7ae0; }
        .search-result-item .action-btn.added { background:var(--bg-input); color:var(--text-muted); cursor:default; }
        .search-results .no-results { text-align:center; color:var(--text-muted); font-size:0.8rem; padding:0.8rem 0; }

        .messenger-chat { flex:1; display:flex; flex-direction:column; height:100vh; background:var(--bg-primary); }
        .chat-header {
            padding:0.6rem 1.2rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; min-height:60px; background:var(--bg-secondary);
        }
        .chat-header .left { display:flex; align-items:center; gap:0.6rem; }
        .chat-header .left .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; overflow:hidden; flex-shrink:0; }
        .chat-header .left .avatar img { width:100%; height:100%; object-fit:cover; }
        .chat-header .left .info .name { font-weight:600; font-size:0.95rem; color:var(--text-primary); }
        .chat-header .left .info .status { font-size:0.7rem; color:#34d399; display:none; }
        .chat-header .left .info .status.show { display:block; }
        .chat-header .actions { display:flex; gap:0.2rem; }
        .chat-header .actions button { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:0.15s; color:var(--text-muted); font-size:1rem; }
        .chat-header .actions button:hover { background:var(--bg-hover); color:var(--text-primary); }
        .chat-header .actions button.danger:hover { background:rgba(239,68,68,0.2); color:#f87171; }

        .chat-messages {
            flex:1; overflow-y:auto; padding:0.8rem 1.2rem; display:flex; flex-direction:column; gap:0.3rem; justify-content:flex-start; align-items:stretch;
        }
        .chat-messages .msg {
            max-width:72%; padding:0.5rem 0.8rem; border-radius:12px; font-size:0.9rem; line-height:1.4; animation:msgIn 0.2s ease; word-wrap:break-word; position:relative; cursor:default;
        }
        .chat-messages .msg:hover { background:var(--bg-hover); }
        @keyframes msgIn { from { opacity:0; transform:translateY(8px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        .chat-messages .msg.out { align-self:flex-end; background:linear-gradient(135deg,#6c8cff,#8b5cf6); color:#fff; border-bottom-right-radius:4px; }
        .chat-messages .msg.in { align-self:flex-start; background:var(--bg-card); color:var(--text-primary); border-bottom-left-radius:4px; border:1px solid var(--border); }
        .chat-messages .msg .time { font-size:0.55rem; opacity:0.5; margin-top:0.15rem; display:block; text-align:right; }
        .chat-messages .msg .voice-msg { display:flex; align-items:center; gap:0.6rem; }
        .chat-messages .msg .voice-msg audio { max-width:180px; height:30px; border-radius:16px; background:transparent; }
        .chat-messages .msg .reply-to { font-size:0.7rem; color:var(--text-muted); border-left:2px solid #6c8cff; padding-left:0.4rem; margin-bottom:0.2rem; opacity:0.7; }
        .chat-messages .system-msg { text-align:center; font-size:0.8rem; color:var(--text-muted); padding:0.6rem 0; width:100%; }
        .chat-messages .system-msg i { font-size:2rem; color:var(--text-muted); margin-bottom:0.3rem; display:block; }

        .context-menu {
            display:none; position:fixed; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:0.3rem 0; min-width:140px; z-index:2000; animation:fadeIn 0.15s ease;
        }
        .context-menu button { display:flex; align-items:center; gap:0.6rem; padding:0.4rem 1rem; width:100%; font-size:0.85rem; color:var(--text-primary); transition:0.15s; text-align:left; background:none; border:none; }
        .context-menu button:hover { background:var(--bg-hover); }
        .context-menu button.danger { color:#f87171; }
        .context-menu button.danger:hover { background:rgba(239,68,68,0.15); }

        .chat-input {
            padding:0.5rem 0.8rem 0.8rem; border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:0.5rem; background:var(--bg-primary); flex-wrap:wrap;
        }
        .chat-input .input-wrap {
            flex:1; background:var(--bg-input); border-radius:18px; padding:0.3rem 0.8rem; display:flex; align-items:flex-end; gap:0.3rem; border:1px solid var(--border); transition:0.2s; min-height:40px;
        }
        .chat-input .input-wrap:focus-within { border-color:#6c8cff; background:var(--bg-elevated); }
        .chat-input .input-wrap textarea { flex:1; background:transparent; border:none; outline:none; color:var(--text-primary); font-size:0.9rem; resize:none; padding:0.3rem 0; max-height:80px; line-height:1.4; }
        .chat-input .input-wrap textarea::placeholder { color:var(--text-muted); }
        .chat-input .input-wrap .btn-icon { padding:0.2rem; border-radius:50%; color:var(--text-muted); transition:0.15s; font-size:1rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:28px; height:28px; }
        .chat-input .input-wrap .btn-icon:hover { color:var(--text-primary); background:var(--bg-hover); }
        .chat-input .input-wrap .btn-icon.recording { color:#f87171; animation:pulseRed 1s infinite; }
        @keyframes pulseRed { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
        .chat-input .btn-send { padding:0.5rem 1.2rem; border-radius:30px; background:linear-gradient(135deg,#6c8cff,#8b5cf6); color:#fff; font-weight:600; font-size:0.85rem; transition:0.2s; box-shadow:0 4px 16px rgba(108,140,255,0.3); height:40px; display:flex; align-items:center; gap:0.3rem; flex-shrink:0; }
        .chat-input .btn-send:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(108,140,255,0.45); }
        .emoji-picker { display:none; padding:0.4rem 0.8rem; background:var(--bg-card); border-top:1px solid var(--border); overflow-y:auto; max-height:120px; flex-wrap:wrap; gap:0.2rem; }
        .emoji-picker span { cursor:pointer; font-size:1.4rem; padding:0.15rem 0.3rem; border-radius:4px; transition:0.15s; display:inline-block; }
        .emoji-picker span:hover { background:var(--bg-hover); transform:scale(1.1); }

        /* ===== PROFILE ===== */
        .profile-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:1000; align-items:center; justify-content:center; animation:fadeIn 0.3s ease;
        }
        .profile-overlay.show { display:flex; }
        .profile-box {
            background:var(--bg-secondary); border-radius:24px; padding:2rem; max-width:450px; width:90%; max-height:90vh; overflow-y:auto; border:1px solid var(--border); box-shadow:var(--shadow);
        }
        .profile-box .profile-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.2rem; }
        .profile-box .profile-header .avatar-big {
            width:70px; height:70px; border-radius:50%; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; font-size:1.8rem; font-weight:600; color:#fff; overflow:hidden; flex-shrink:0; cursor:pointer; position:relative; border:3px solid #6c8cff;
        }
        .profile-box .profile-header .avatar-big img { width:100%; height:100%; object-fit:cover; }
        .profile-box .profile-header .avatar-big .upload-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.3rem; opacity:0; transition:0.2s; border-radius:50%; }
        .profile-box .profile-header .avatar-big:hover .upload-overlay { opacity:1; }
        .profile-box .profile-header .info h2 { font-size:1.2rem; font-weight:600; }
        .profile-box .profile-header .info p { color:var(--text-muted); font-size:0.85rem; }
        .profile-box .field { margin-bottom:1rem; }
        .profile-box .field label { display:block; font-size:0.75rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.2rem; text-transform:uppercase; letter-spacing:0.5px; }
        .profile-box .field input { width:100%; padding:0.6rem 0.9rem; border-radius:10px; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); font-size:0.9rem; transition:0.2s; }
        .profile-box .field input:focus { border-color:#6c8cff; background:var(--bg-elevated); box-shadow:0 0 0 3px rgba(108,140,255,0.15); }
        .profile-box .field .optional { font-weight:400; text-transform:none; color:var(--text-muted); font-size:0.65rem; }
        .profile-box .pass-msg { font-size:0.8rem; margin-top:0.3rem; color:var(--text-muted); }
        .profile-box .pass-msg.success { color:#4cd9a0; }
        .profile-box .pass-msg.error { color:#f87171; }
        .profile-box .profile-actions { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.5rem; }
        .profile-box .profile-actions button { flex:1; padding:0.6rem 1rem; border-radius:10px; font-weight:600; transition:0.2s; min-width:80px; font-size:0.85rem; }
        .btn-save { background:#6c8cff; color:#fff; }
        .btn-save:hover { background:#5a7ae0; }
        .btn-close { background:var(--bg-elevated); color:var(--text-primary); }
        .btn-close:hover { background:var(--bg-hover); }
        .btn-danger { background:#ef4444; color:#fff; }
        .btn-danger:hover { background:#dc2626; }

        /* ===== CALL ===== */
        .call-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(16px); z-index:1000; align-items:center; justify-content:center; flex-direction:column; animation:fadeIn 0.3s ease;
        }
        .call-overlay.show { display:flex; }
        .call-overlay .call-avatar { width:90px; height:90px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.2rem; font-weight:700; color:#fff; margin-bottom:1rem; box-shadow:0 16px 48px rgba(108,140,255,0.3); overflow:hidden; }
        .call-overlay .call-avatar img { width:100%; height:100%; object-fit:cover; }
        .call-overlay .call-name { font-size:1.6rem; font-weight:600; color:#fff; }
        .call-overlay .call-status { font-size:0.9rem; color:var(--text-muted); margin-top:0.2rem; }
        .call-overlay .call-timer { font-size:1.2rem; color:var(--text-primary); margin-top:0.3rem; font-variant-numeric:tabular-nums; }
        .call-overlay .call-actions { display:flex; gap:1rem; margin-top:2rem; }
        .call-overlay .call-actions button { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; transition:0.2s; color:var(--text-primary); background:var(--bg-card); }
        .call-overlay .call-actions button:hover { transform:scale(1.08); }
        .call-overlay .call-actions .end-call { background:#ef4444; color:#fff; }
        .call-overlay .call-actions .end-call:hover { background:#dc2626; }
        .call-overlay .call-actions .mute-call.active { background:rgba(239,68,68,0.3); color:#f87171; }
        .call-overlay video { display:none; width:200px; border-radius:12px; margin-top:1rem; background:#111; border:2px solid #6c8cff; position:absolute; bottom:120px; right:20px; }

        #toast {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--bg-card); backdrop-filter:blur(8px); padding:0.5rem 1.4rem; border-radius:30px; font-size:0.85rem; color:var(--text-primary); z-index:9999; display:none; pointer-events:none; border:1px solid var(--border); transition:0.3s;
        }

        @media (max-width:768px) {
            .messenger-sidebar { width:220px; min-width:220px; }
            .auth-box { padding:2rem 1.4rem; }
            .chat-messages .msg { max-width:85%; }

    <script>
        // ============================================================
        //  STORAGE
        // ============================================================
        const STORAGE_KEY = 'pulsechatData';

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (!data.users) data.users = [];
                    if (!data.contacts) data.contacts = [];
                    if (!data.messages) data.messages = {};
                    if (!data.currentUser) data.currentUser = null;
                    return data;
                }
            } catch (e) { console.warn('Ошибка загрузки данных', e); }
            return { users: [], contacts: [], messages: {}, currentUser: null };
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    users: USERS,
                    contacts: CONTACTS,
                    messages: MESSAGES_BY_CONTACT,
                    currentUser: currentUser ? currentUser.id : null
                }));
            } catch (e) { console.warn('Ошибка сохранения данных', e); }
        }

        // ============================================================
        //  GLOBALS
        // ============================================================
        let USERS = [];
        let CONTACTS = [];
        let MESSAGES_BY_CONTACT = {};
        let currentUser = null;
        let currentContactId = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let callInterval = null;
        let callSeconds = 0;
        let isMuted = false;
        let isCameraOn = false;
        let localStream = null;
        let authMode = 'login';
        let pendingLoginUser = null;
        let replyToMessage = null;

        // ===== DOM =====
        const $ = id => document.getElementById(id);
        const authWrapper = $('auth-wrapper');
        const messengerPage = $('messenger-page');
        const authTitle = $('auth-title');
        const authSub = $('auth-sub');
        const authToggleText = $('auth-toggle-text');
        const authToggleLink = $('auth-toggle-link');
        const authEmail = $('auth-email');
        const authUsername = $('auth-username');
        const authDisplayName = $('auth-displayname');
        const authPhone = $('auth-phone');
        const authPassword = $('auth-password');
        const authCode = $('auth-code');
        const authSubmitBtn = $('auth-submit-btn');
        const authError = $('auth-error');
        const contactList = $('contact-list');
        const chatMessages = $('chat-messages');
        const msgInput = $('msg-input');
        const chatContactName = $('chat-contact-name');
        const chatContactStatus = $('chat-contact-status');
        const chatAvatar = $('chat-avatar');
        const sidebarAvatarLetter = $('sidebar-avatar-letter');
        const voiceBtn = $('voice-btn');
        const callOverlay = $('call-overlay');
        const callAvatar = $('call-avatar');
        const callName = $('call-name');
        const callStatus = $('call-status');
        const callTimer = $('call-timer');
        const callMuteBtn = $('call-mute-btn');
        const callCamBtn = $('call-cam-btn');
        const localVideo = $('local-video');
        const toast = $('toast');
        const searchResults = $('search-results');
        const searchInput = $('search-input');
        const emojiPicker = $('emoji-picker');
        const fileInput = $('file-input');

        // Profile
        const profileOverlay = $('profile-overlay');
        const profileAvatarTrigger = $('profile-avatar-trigger');
        const profileAvatarLetter = $('profile-avatar-letter');
        const profileAvatarImg = $('profile-avatar-img');
        const profileNameDisplay = $('profile-name-display');
        const profileUsernameDisplay = $('profile-username-display');
        const profileNameInput = $('profile-name-input');
        const profileUsernameInput = $('profile-username-input');
        const profilePhoneInput = $('profile-phone-input');
        const profileOldPass = $('profile-old-pass');
        const profileNewPass = $('profile-new-pass');
        const profilePassMsg = $('profile-pass-msg');
        const authThemeToggle = $('auth-theme-toggle');

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            const stored = loadData();
            USERS = stored.users || [];
            CONTACTS = stored.contacts || [];
            MESSAGES_BY_CONTACT = stored.messages || {};

            const savedTheme = localStorage.getItem('pulsechat-theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                authThemeToggle.checked = true;
            }

            if (stored.currentUser) {
                currentUser = USERS.find(u => u.id === stored.currentUser) || null;
            }

            if (currentUser) {
                showMessenger();
            } else {
                authWrapper.style.display = 'flex';
                messengerPage.classList.remove('active');
                showAuth('login');
            }

            msgInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 80) + 'px';
            });

            chatContactStatus.classList.remove('show');
            renderContacts();
            if (currentContactId) {
                selectContact(currentContactId);
            } else if (currentUser) {
                showNoContactMessage();
            }
            updateProfileUI();

            profileAvatarTrigger.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleAvatarUpload);

            document.getElementById('sidebar-avatar').addEventListener('click', openProfile);

            // Context menu
            chatMessages.addEventListener('contextmenu', function(e) {
                const msgEl = e.target.closest('.msg');
                if (!msgEl) return;
                e.preventDefault();
                const msgId = msgEl.dataset.msgId;
                if (msgId) showContextMenu(e.clientX, e.clientY, msgId);
            });
            let longPressTimer = null;
            chatMessages.addEventListener('touchstart', function(e) {
                const msgEl = e.target.closest('.msg');
                if (!msgEl) return;
                const msgId = msgEl.dataset.msgId;
                if (!msgId) return;
                longPressTimer = setTimeout(() => {
                    showContextMenu(e.touches[0].clientX, e.touches[0].clientY, msgId);
                }, 500);
            });
            chatMessages.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
            chatMessages.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.context-menu')) {
                    document.querySelector('.context-menu')?.remove();
                }
            });
        }

        function applyTheme(isLight) {
            if (isLight) {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('pulsechat-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('pulsechat-theme');
            }
        }
        function toggleTheme() { applyTheme(authThemeToggle.checked); }

        // ============================================================
        //  GOOGLE AUTH
        // ============================================================
        window.handleGoogleCredentialResponse = function(response) {
            try {
                const payload = parseJwt(response.credential);
                const email = payload.email;
                const name = payload.name;
                const picture = payload.picture;

                let user = USERS.find(u => u.email === email);
                if (!user) {
                    const newUser = {
                        id: generateId(),
                        username: email.split('@')[0],
                        displayName: name || email.split('@')[0],
                        email: email,
                        phone: '',
                        password: '',
                        avatar: picture || null,
                        googleId: payload.sub
                    };
                    USERS.push(newUser);
                    user = newUser;
                    saveData();
                    showToast('🔐 Аккаунт создан через Google');
                }
                currentUser = user;
                saveData();
                showMessenger();
                showToast(`👋 Добро пожаловать, ${user.displayName || user.username}!`);
            } catch (e) {
                console.error('Ошибка обработки Google токена', e);
                authError.textContent = '⚠️ Ошибка входа через Google';
                showToast('⚠️ Ошибка входа через Google', 'error');
            }
        };
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            return JSON.parse(jsonPayload);
        }

        // ============================================================
        //  SHOW MESSENGER
        // ============================================================
        function showMessenger() {
            authWrapper.style.display = 'none';
            messengerPage.classList.add('active');
            sidebarAvatarLetter.textContent = (currentUser.displayName || currentUser.username).charAt(0).toUpperCase();
            renderContacts();
            if (currentContactId) selectContact(currentContactId);
            else showNoContactMessage();
            updateProfileUI();
            saveData();
        }

        function showNoContactMessage() {
            chatMessages.innerHTML = `<div class="system-msg"><i class="fas fa-comment-alt"></i><div style="font-size:1rem;color:var(--text-muted);">Выберите контакт</div></div>`;
            chatContactName.textContent = 'Выберите контакт';
            chatAvatar.textContent = '?';
            chatAvatar.style.background = '#6c8cff';
            chatContactStatus.classList.remove('show');
        }

        // ============================================================
        //  AUTH
        // ============================================================
        function showAuth(mode) {
            authMode = mode || 'login';
            authCode.style.display = 'none';
            authCode.value = '';
            pendingLoginUser = null;
            authError.textContent = '';

            if (authMode === 'register') {
                authTitle.textContent = 'Создать аккаунт';
                authToggleText.textContent = 'Уже есть аккаунт?';
                authToggleLink.textContent = 'Войти';
                authSubmitBtn.textContent = 'Зарегистрироваться';
                $('auth-displayname-field').style.display = 'block';
                $('auth-phone-field').style.display = 'block';
                $('auth-username-field').style.display = 'block';
            } else {
                authTitle.textContent = 'Войти в PulseChat';
                authToggleText.textContent = 'Нет аккаунта?';
                authToggleLink.textContent = 'Зарегистрироваться';
                authSubmitBtn.textContent = 'Войти';
                $('auth-displayname-field').style.display = 'none';
                $('auth-phone-field').style.display = 'none';
                $('auth-username-field').style.display = 'block';
            }
        }

        authToggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            showAuth(authMode === 'login' ? 'register' : 'login');
        });

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
        }

        let originalSubmitHandler = null;

        authSubmitBtn.addEventListener('click', function() {
            const email = authEmail.value.trim();
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (authMode === 'register') {
                const displayName = authDisplayName.value.trim();
                const phone = authPhone.value.trim();
                if (!email || !username || !password || !displayName) {
                    authError.textContent = '⚠️ Заполните все обязательные поля';
                    return;
                }
                if (password.length < 4) {
                    authError.textContent = '⚠️ Пароль ≥4 символов';
                    return;
                }
                if (!email.includes('@')) {
                    authError.textContent = '⚠️ Неверный email';
                    return;
                }
                if (!username.startsWith('@')) {
                    authError.textContent = '⚠️ Username должен начинаться с @';
                    return;
                }
                if (USERS.find(u => u.username === username)) {
                    authError.textContent = '⚠️ Такой username уже занят';
                    return;
                }
                if (USERS.find(u => u.email === email)) {
                    authError.textContent = '⚠️ Email уже используется';
                    return;
                }

                const newUser = {
                    id: generateId(),
                    username: username,
                    displayName: displayName,
                    email: email,
                    phone: phone || '',
                    password: password,
                    avatar: null,
                    googleId: null
                };
                USERS.push(newUser);
                currentUser = newUser;
                saveData();
                showMessenger();
                showToast(`👋 Добро пожаловать, ${displayName}!`);
                return;
            }

            // LOGIN
            if (!email || !password) {
                authError.textContent = '⚠️ Введите email и пароль';
                return;
            }
            const user = USERS.find(u => u.email === email && u.password === password);
            if (!user) {
                authError.textContent = '⚠️ Неверный email или пароль';
                return;
            }

            // 2FA
            $('auth-code-field').style.display = 'block';
            authSubmitBtn.textContent = 'Подтвердить код';
            pendingLoginUser = user;
            authError.textContent = '📱 Введите код (для теста: 123456)';

            const verifyHandler = function() {
                const code = authCode.value.trim();
                if (code === '123456') {
                    currentUser = pendingLoginUser;
                    pendingLoginUser = null;
                    $('auth-code-field').style.display = 'none';
                    authSubmitBtn.textContent = 'Войти';
                    authSubmitBtn.onclick = originalSubmitHandler || authSubmitBtnHandler;
                    showMessenger();
                    showToast(`🔓 Добро пожаловать, ${currentUser.displayName || currentUser.username}!`);
                } else {
                    authError.textContent = '⚠️ Неверный код. Попробуйте 123456';
                }
            };
            if (!originalSubmitHandler) originalSubmitHandler = authSubmitBtn.onclick;

        function searchUsers(query) {

            if (!q || !currentUser) {
                searchResults.innerHTML = '';
                searchResults.style.display = 'none';
                return;
            }
            const found = USERS.filter(u =>
                u.id !== currentUser.id &&
                (u.username.toLowerCase().includes(q) ||
                 u.displayName.toLowerCase().includes(q) ||
                 (u.phone && u.phone.includes(q)))
            );
            searchResults.style.display = 'block';
            if (found.length === 0) {
                searchResults.innerHTML = `<div class="no-results">👀 Пользователи не найдены</div>`;
                return;
            }
            let html = '';
            found.forEach(u => {
                const isContact = CONTACTS.some(c => c.id === u.id);
                const avatar = u.avatar || u.displayName.charAt(0).toUpperCase();
                const style = u.avatar ? '' : `background:linear-gradient(135deg,#6c8cff,#8b5cf6);`;
                html += `
                    <div class="search-result-item">
                        <div class="avatar" style="${style}">${u.avatar ? `<img src="${u.avatar}" />` : avatar}</div>
                        <div class="info">
                            <div class="name">${u.displayName}</div>
                            <div class="username">${u.username}${u.phone ? ' · 📱' : ''}</div>
                        </div>
                        <button class="action-btn ${isContact ? 'added' : ''}" onclick="${isContact ? '' : `addContact('${u.id}')`}" ${isContact ? 'disabled' : ''}>
                            ${isContact ? '✓' : '➕'}
                        </button>
                    </div>
                `;
            });
            searchResults.innerHTML = html;
        }

        function addContact(userId) {
            const user = USERS.find(u => u.id === userId);

            if (CONTACTS.some(c => c.id === userId)) {
                showToast('⚠️ Уже в контактах');

                time: '',
                unread: 0
            });

                currentUser.avatar = event.target.result;

                showToast('✅ Аватар обновлён');

        function saveProfile() {
            const newUsername = profileUsernameInput.value.trim();
            const newName = profileNameInput.value.trim();
            const newPhone = profilePhoneInput.value.trim();

            if (!newUsername || !newName) {
                showToast('⚠️ Заполните обязательные поля');
                return;
            }
            if (!newUsername.startsWith('@')) {
                profilePassMsg.textContent = '⚠️ Username должен начинаться с @';
                profilePassMsg.className = 'pass-msg error';
                return;
            }
            const existingUser = USERS.find(u => u.username === newUsername && u.id !== currentUser.id);
            if (existingUser) {
                profilePassMsg.textContent = '⚠️ Такой username уже занят';
                profilePassMsg.className = 'pass-msg error';
                return;
            }

            currentUser.username = newUsername;
            currentUser.displayName = newName;
            currentUser.phone = newPhone;
            sidebarAvatarLetter.textContent = newName.charAt(0).toUpperCase();

            const oldPass = profileOldPass.value;
            const newPass = profileNewPass.value;
            if (oldPass && newPass) {
                if (newPass.length < 4) {
                    profilePassMsg.textContent = '⚠️ Пароль ≥4 символов';
                    profilePassMsg.className = 'pass-msg error';
                    return;
                }
                if (currentUser.password && currentUser.password !== oldPass) {
                    profilePassMsg.textContent = '⚠️ Неверный старый пароль';
                    profilePassMsg.className = 'pass-msg error';
                    return;
                }
                currentUser.password = newPass;
                profilePassMsg.textContent = '✅ Пароль изменён';
                profilePassMsg.className = 'pass-msg success';
            } else {
                profilePassMsg.textContent = '✅ Настройки сохранены';
                profilePassMsg.className = 'pass-msg success';
            }

            saveData();
            updateProfileUI();
            renderContacts();
            showToast('✅ Настройки сохранены');
        }

            const index = USERS.findIndex(u => u.id === currentUser.id);

        // ============================================================
        //  CONTACTS

        function renderContacts() {

            if (CONTACTS.length === 0) {
                html += `<div class="empty-contacts"><i class="fas fa-user-plus"></i><div>Нет контактов</div><div style="font-size:0.75rem;color:var(--text-muted);">Найдите друзей через поиск</div></div>`;
            } else {

                    const avatarContent = c.avatar && c.avatar.startsWith('data:image') ? `<img src="${c.avatar}" />` : c.avatar || '?';

        function selectContact(id) {
            const contact = CONTACTS.find(c => c.id === id);
            if (!contact) { showToast('⚠️ Контакт не найден'); return; }
            currentContactId = id;
            const user = USERS.find(u => u.id === id);
            chatContactName.textContent = contact.name;
            const avatarContent = contact.avatar && contact.avatar.startsWith('data:image') ? `<img src="${contact.avatar}" />` : contact.avatar || '?';
            chatAvatar.innerHTML = avatarContent;
            chatAvatar.style.background = contact.color || '#6c8cff';
            chatContactStatus.textContent = user && user.status === 'online' ? '● В сети' : '● Не в сети';

        // ============================================================
        //  MESSAGES
        // ============================================================
        function renderMessages(contactId) {
            const msgs = MESSAGES_BY_CONTACT[contactId] || [];
            const contact = CONTACTS.find(c => c.id === contactId);
            let html = `<div class="system-msg">— ${contact?.name || 'Чат'} —</div>`;
            if (msgs.length === 0) {
                html += `<div class="system-msg" style="color:var(--text-muted);">Нет сообщений</div>`;
            } else {
                msgs.forEach(m => {
                    const cls = m.from === 'me' ? 'out' : 'in';
                    let content = m.text || '';
                    if (m.file) {
                        content = `<a href="${m.file}" target="_blank" style="color:#6c8cff;text-decoration:underline;">📎 ${m.fileName || 'Файл'}</a>`;
                    }
                    const replyHtml = m.replyTo ? `<div class="reply-to">↳ ${m.replyTo.text || 'сообщение'}</div>` : '';
                    html += `
                        <div class="msg ${cls}" data-msg-id="${m.id}">
                            ${replyHtml}
                            ${content}
                            <span class="time">${m.time || ''}</span>
                        </div>
                    `;
                });
            }
            chatMessages.innerHTML = html;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================================
        //  SEND
        // ============================================================
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            if (!currentContactId) { showToast('⚠️ Выберите контакт'); return; }
            const contact = CONTACTS.find(c => c.id === currentContactId);
            if (!contact) { showToast('⚠️ Контакт не найден'); return; }

            const now = new Date();
            const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
            const msgId = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
            const msg = {
                id: msgId,
                from: 'me',
                text: text,
                time: time,
                replyTo: replyToMessage ? { text: replyToMessage.text || 'голосовое' } : null
            };
            if (!MESSAGES_BY_CONTACT[currentContactId]) MESSAGES_BY_CONTACT[currentContactId] = [];
            MESSAGES_BY_CONTACT[currentContactId].push(msg);

            contact.lastMsg = text;
            contact.time = time;

            msgInput.value = '';
            msgInput.style.height = 'auto';
            replyToMessage = null;
            renderMessages(currentContactId);
            renderContacts();
            saveData();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {

                sendMessage();

                        fileType:file.type
                    };
                    MESSAGES_BY_CONTACT[currentContactId].push(msg);
                    const contact = CONTACTS.find(c=>c.id===currentContactId);
                    if(contact){ contact.lastMsg='📎 '+file.name; contact.time=time; }
                    saveData();
                    renderMessages(currentContactId);

        // ============================================================
        //  VOICE
        // ============================================================
        async function toggleVoiceRecording() {
            if (isRecording) {
                if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                showToast('⏹️ Запись остановлена');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const now = new Date();
                    const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
                    const msgId = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
                    if (!MESSAGES_BY_CONTACT[currentContactId]) MESSAGES_BY_CONTACT[currentContactId] = [];
                    MESSAGES_BY_CONTACT[currentContactId].push({
                        id: msgId,
                        from: 'me',
                        text: '🎤 Голосовое',
                        time: time,
                        isVoice: true,
                        audioUrl: audioUrl
                    });
                    const contact = CONTACTS.find(c => c.id === currentContactId);
                    if (contact) { contact.lastMsg = '🎤 Голосовое'; contact.time = time; }
                    renderMessages(currentContactId);
                    renderContacts();
                    showToast('✅ Голосовое отправлено!');
                    saveData();
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
                showToast('🔴 Запись... Нажмите ещё раз для остановки');
            } catch (err) {
                showToast('⚠️ Нет доступа к микрофону');
                console.error(err);
            }
        }

        // ============================================================
        //  CALL
        // ============================================================
        let callContactId = null;

        function startCall() {
            const contact = CONTACTS.find(c => c.id === currentContactId);
            if (!contact) { showToast('⚠️ Выберите контакт'); return; }
            callContactId = contact.id;
            const avatarContent = contact.avatar && contact.avatar.startsWith('data:image') ? `<img src="${contact.avatar}" />` : contact.avatar || '?';
            callAvatar.innerHTML = avatarContent;
            callAvatar.style.background = contact.color || '#6c8cff';
            callName.textContent = contact.name;
            callStatus.textContent = 'Соединение...';
            callTimer.textContent = '00:00';
            callSeconds = 0;
            isMuted = false;
            isCameraOn = false;
            callMuteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            callMuteBtn.classList.remove('active');
            callCamBtn.innerHTML = '<i class="fas fa-video"></i>';
            callCamBtn.classList.remove('active');
            localVideo.style.display = 'none';

            navigator.mediaDevices.getUserMedia({ audio: true, video: true })
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    localVideo.style.display = 'block';
                    isCameraOn = true;
                    callCamBtn.innerHTML = '<i class="fas fa-video"></i>';
                    callCamBtn.classList.add('active');
                })
                .catch(() => {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => { localStream = stream; })
                        .catch(err => { showToast('⚠️ Нет доступа к микрофону'); console.error(err); });
                });

            callOverlay.classList.add('show');
            setTimeout(() => {
                callStatus.textContent = 'В разговоре';
                if (callInterval) clearInterval(callInterval);
                callInterval = setInterval(() => {
                    callSeconds++;
                    const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
                    const s = String(callSeconds%60).padStart(2,'0');
                    callTimer.textContent = `${m}:${s}`;
                }, 1000);
                showToast(`📞 Звонок ${contact.name} начался`);
            }, 1500);
        }

        function toggleCamera() {
            if (!localStream) { showToast('⚠️ Камера недоступна'); return; }
            isCameraOn = !isCameraOn;
            const videoTracks = localStream.getVideoTracks();
            videoTracks.forEach(track => track.enabled = isCameraOn);
            callCamBtn.innerHTML = isCameraOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
            callCamBtn.classList.toggle('active', isCameraOn);
            localVideo.style.display = isCameraOn ? 'block' : 'none';
            showToast(isCameraOn ? '🎥 Камера включена' : '🎥 Камера выключена');
        }

        function endCall() {
            if (callInterval) { clearInterval(callInterval); callInterval = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            localVideo.style.display = 'none';
            callOverlay.classList.remove('show');
            showToast('📞 Звонок завершён');
            const contact = CONTACTS.find(c => c.id === callContactId);
            if (contact && currentContactId === callContactId) {
                const now = new Date();
                const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
                if (!MESSAGES_BY_CONTACT[currentContactId]) MESSAGES_BY_CONTACT[currentContactId] = [];
                MESSAGES_BY_CONTACT[currentContactId].push({
                    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                    from: 'system',
                    text: `📞 Звонок с ${contact.name} (${Math.floor(callSeconds/60)}:${String(callSeconds%60).padStart(2,'0')})`,
                    time: time
                });
                renderMessages(currentContactId);
                saveData();
            }
            callContactId = null;
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (localStream) {
                const audioTracks = localStream.getAudioTracks();
                audioTracks.forEach(track => track.enabled = !isMuted);
            }
            callMuteBtn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            callMuteBtn.classList.toggle('active', isMuted);
            showToast(isMuted ? '🔇 Микрофон выключен' : '🎤 Микрофон включён');
        }

        // ============================================================
        //  CONTEXT MENU
        // ============================================================
        function showContextMenu(x, y, msgId) {
            document.querySelector('.context-menu')?.remove();
            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            if (x + 160 > window.innerWidth) menu.style.left = (x - 160) + 'px';
            if (y + 120 > window.innerHeight) menu.style.top = (y - 120) + 'px';
            menu.innerHTML = `
                <button onclick="replyToMessage('${msgId}')"><i class="fas fa-reply"></i> Ответить</button>
                <button onclick="forwardMessage('${msgId}')"><i class="fas fa-share"></i> Переслать</button>
                <button class="danger" onclick="deleteMessage('${msgId}')"><i class="fas fa-trash"></i> Удалить</button>
            `;
            document.body.appendChild(menu);
            menu.style.display = 'block';
        }

        function replyToMessage(msgId) {
            document.querySelector('.context-menu')?.remove();
            const msgs = MESSAGES_BY_CONTACT[currentContactId] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;
            replyToMessage = msg;
            msgInput.focus();
            msgInput.value = '> ' + (msg.text || 'голосовое') + '\n';
            msgInput.dispatchEvent(new Event('input'));
            showToast('✏️ Ответ');
        }

        function forwardMessage(msgId) {
            document.querySelector('.context-menu')?.remove();
            const msgs = MESSAGES_BY_CONTACT[currentContactId] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;
            navigator.clipboard.writeText(msg.text || 'голосовое').then(() => {
                showToast('📋 Скопировано');
            }).catch(() => showToast('⚠️ Ошибка копирования'));
        }

        function deleteMessage(msgId) {
            document.querySelector('.context-menu')?.remove();
            if (!confirm('Удалить сообщение?')) return;
            const msgs = MESSAGES_BY_CONTACT[currentContactId] || [];
            const idx = msgs.findIndex(m => m.id === msgId);
            if (idx === -1) return;
            msgs.splice(idx, 1);
            const contact = CONTACTS.find(c => c.id === currentContactId);
            if (contact) {
                const last = msgs[msgs.length - 1];
                contact.lastMsg = last ? (last.text || 'голосовое') : '';
                contact.time = last ? last.time : '';
            }
            saveData();
            renderMessages(currentContactId);
            renderContacts();
            showToast('🗑️ Удалено');
        }
